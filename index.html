<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>3Days.ai</title>
    <!-- Applies the theme before first paint, so a dark reload never flashes white.
         Must resolve exactly as src/contexts/ThemeContext.tsx does: stored choice, else the OS. -->
    <script data-theme-bootstrap>
      (function () {
        var theme = 'system';
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') theme = stored;
        } catch (e) {}
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <meta name="description" content="Your Pincer agent takes on the repeatable work — reclaim three workdays a week." />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:title" content="3Days.ai" />
    <meta property="og:description" content="Your Pincer agent takes on the repeatable work — reclaim three workdays a week." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Marketing site type system: Sora (display), Manrope (body), IBM Plex Mono (labels) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <!-- Runtime configuration (window.__ENV__), written at container start. Must run before the bundle. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
